services:
  postgres:
    image: postgres:16-alpine
    container_name: petcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcare_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-petcare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - petcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petcare} -d ${POSTGRES_DB:-petcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petcare_pgdata:

